[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-app"
version = "0.1.0"
description = "GTK television front-end with embedded mpv playback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["python-mpv>=1.0.7"]

[project.scripts]
tv-app = "tv_app.__main__:main"

[tool.setuptools.packages.find]
include = ["tv_app*"]
